<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBypass - Celestial Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            /* Menggunakan gambar kosmik monokrom sebagai background */
            background-image: url('1001058605.jpg'); /* Pastikan file gambar disatukan atau di-host dengan nama ini */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Efek glassmorphism yang disesuaikan dengan tema monokrom/gelap */
        .glass {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-slate-200 selection:text-black">

    <!-- Dark Overlay agar teks tetap terbaca jelas di atas gambar latar belakang -->
    <div class="fixed inset-0 bg-black/60 pointer-events-none z-0"></div>

    <!-- Main Container -->
    <main class="relative z-10 max-w-xl mx-auto px-4 py-16 w-full flex-grow flex flex-col justify-center">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-block px-3.5 py-1 mb-4 rounded-full text-xs font-semibold bg-white/10 text-slate-200 border border-white/20 backdrop-blur-md shadow-lg">
                ✨ Celestial Bypass Tool
            </div>
            <h1 class="text-4xl font-bold tracking-tight mb-2 bg-gradient-to-r from-white via-slate-300 to-slate-500 bg-clip-text text-transparent">
                SafeBypass
            </h1>
            <p class="text-slate-400 text-sm">
                Lewati Safelinku dan shortlink lainnya dengan gaya kosmik tanpa iklan mengganggu.
            </p>
        </div>

        <!-- Card Box -->
        <div class="glass p-6 sm:p-8 rounded-2xl">
            <form id="bypassForm" onsubmit="handleBypass(event)" class="space-y-4">
                <div>
                    <label for="urlInput" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Masukkan Link Shortlink
                    </label>
                    <input 
                        type="url" 
                        id="urlInput" 
                        required 
                        placeholder="https://sfl.gl/xxxx..." 
                        class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-white/40 focus:ring-1 focus:ring-white/40 transition-all"
                    >
                </div>
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-white hover:bg-slate-200 text-black font-semibold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-white/10 flex items-center justify-center space-x-2 cursor-pointer active:scale-[0.98]"
                >
                    <span>Bypass Sekarang</span>
                </button>
            </form>

            <!-- Error Notification -->
            <div id="errorSection" class="hidden mt-4 p-3 bg-red-950/40 border border-red-500/30 rounded-xl text-red-300 text-xs"></div>

            <!-- Result Section -->
            <div id="resultSection" class="hidden mt-6 pt-6 border-t border-white/10 space-y-3">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                    Hasil Link Asli:
                </label>
                <div class="flex items-center space-x-2">
                    <input 
                        type="text" 
                        id="resultInput" 
                        readonly 
                        class="w-full bg-black/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none"
                    >
                    <button 
                        type="button"
                        onclick="copyResult()" 
                        class="bg-white/10 hover:bg-white/20 text-slate-200 px-4 py-3 rounded-xl text-sm font-medium transition-all shrink-0 cursor-pointer border border-white/10"
                    >
                        Salin
                    </button>
                </div>
                <a 
                    id="visitBtn" 
                    href="#" 
                    target="_blank" 
                    class="block text-center w-full bg-white/10 hover:bg-white/20 text-white border border-white/20 py-2.5 rounded-xl text-xs font-semibold transition-all backdrop-blur-md"
                >
                    Buka Link ↗
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-xs text-slate-500">
        <p>Built with 🗿 for educational purposes.</p>
    </footer>

    <script>
        async function handleBypass(event) {
            event.preventDefault();
            const urlInput = document.getElementById('urlInput').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultSection = document.getElementById('resultSection');
            const errorSection = document.getElementById('errorSection');
            const resultInput = document.getElementById('resultInput');
            const visitBtn = document.getElementById('visitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-black inline-block" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Memproses...</span>
            `;
            resultSection.classList.add('hidden');
            errorSection.classList.add('hidden');

            try {
                const response = await fetch('/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Gagal memproses link.');
                }

                resultInput.value = data.destination;
                visitBtn.href = data.destination;
                resultSection.classList.remove('hidden');
            } catch (err) {
                errorSection.textContent = err.message;
                errorSection.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Bypass Sekarang</span>`;
            }
        }

        function copyResult() {
            const resultInput = document.getElementById('resultInput');
            resultInput.select();
            navigator.clipboard.writeText(resultInput.value);
            alert("Link berhasil disalin! 📋");
        }
    </script>
</body>
</html>
