<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VynnStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#4c8dff;--on-acc:#fff;
  --bg:#000;--s1:#0b0b0c;--s2:#151517;--line:#1d1d20;--line2:#2c2c31;
  --ink:#f4f4f6;--mute:#8e8e9b;--ok:#4ade80;--err:#ff6b6b;--warn:#ffc15a;
  --grid:rgba(255,255,255,.035);--hi:rgba(255,255,255,.05);
  --shadow:0 24px 48px -28px rgba(0,0,0,.9);
  --disp:'Bricolage Grotesque','Geist',system-ui,sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --soft:color-mix(in srgb,var(--acc) 13%,transparent);
  --glow:color-mix(in srgb,var(--acc) 26%,transparent);
  --r-xs:6px;--r-sm:8px;--r-md:10px;--r-lg:14px;
}
:root[data-theme="light"]{
  --bg:#f3f4f9;--s1:#fff;--s2:#eef0f8;--line:#e0e3f0;--line2:#c9cee4;
  --ink:#15182e;--mute:#62698a;--ok:#0f9d63;--err:#d63a3a;--warn:#b97a00;
  --grid:rgba(20,30,80,.05);--hi:rgba(255,255,255,.9);
  --shadow:0 20px 40px -28px rgba(30,40,90,.35);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
::selection{background:var(--acc);color:var(--on-acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:18px;height:18px;flex:none}

/* header */
.top{position:sticky;top:0;z-index:20;padding:max(12px,env(safe-area-inset-top)) 20px 12px;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{display:flex;align-items:center;gap:9px;min-width:0}
.mark span{font:400 20px 'Russo One',var(--disp);letter-spacing:.01em;white-space:nowrap}
.mark span em{font-style:normal;color:var(--acc)}
.tools{display:flex;align-items:center;gap:8px}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:transform .25s,color .15s,border-color .15s}
.icon:hover{color:var(--ink);border-color:var(--line2)}

main{flex:1;padding:0 20px calc(48px + env(safe-area-inset-bottom))}

/* hero */
.hero{padding-top:34px}
.ttl{margin:0 0 10px;text-align:center;font:800 clamp(1.9rem,8.8vw,2.5rem)/1.08 var(--disp);letter-spacing:-.04em}
.ttl em{font-style:normal;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 60%,#fff),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:0 auto 26px;max-width:32ch;text-align:center;color:var(--mute);font-size:14.5px;line-height:1.5}

/* form */
.box{display:flex;flex-direction:column;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.lbl{display:block;margin:0 2px 8px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.field{display:flex;align-items:center;gap:8px;height:56px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:0 8px 0 14px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--soft)}
.field>svg{color:var(--mute)}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 2px;font:400 14.5px var(--mono)}
.field input:focus{outline:none}
.field input::placeholder{color:var(--mute);opacity:.45}

.go{position:relative;overflow:hidden;width:100%;height:52px;border:0;cursor:pointer;color:var(--on-acc);font:700 15px var(--sans);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 86%,#fff),var(--acc));box-shadow:0 14px 28px -12px var(--glow);transition:filter .15s,transform .1s}
.go:hover{filter:brightness(1.06)}
.go:active{transform:scale(.985)}

/* hasil */
.result{display:none;margin-top:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px 14px;box-shadow:var(--shadow)}
.result.show{display:block}
.host{font:800 18px var(--disp);word-break:break-all}
.full{margin:14px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);font:400 12px var(--mono);word-break:break-all}
.full a{color:var(--ink);text-decoration:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;text-decoration:none;cursor:pointer;font-weight:600;font-size:13px;border-radius:var(--r-md);border:1px solid var(--line2);background:var(--s2);color:var(--ink)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

.foot{margin-top:40px;text-align:center;font:500 12px var(--mono);color:var(--mute)}
.foot em{font-style:normal;color:var(--acc)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="head">
      <div class="mark">
        <span>Vynn<em>Store</em></span>
      </div>
      <div class="tools">
        <button class="icon" id="themeToggle" title="Ganti Tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="ttl">Bypass <em>Tools</em></h1>
      <p class="tag">Lewati shortlink dengan cepat, bersih, dan tanpa kendala server.</p>

      <div class="box">
        <div>
          <label class="lbl">Masukkan Link Shortlink</label>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
            <input type="text" id="urlInput" placeholder="https://sfl.gl/..." autocomplete="off">
          </div>
        </div>
        <button class="go" id="bypassBtn">
          <span>Proses Sekarang</span>
        </button>
      </div>

      <div class="result" id="resultBox">
        <div class="host">Hasil Tautan:</div>
        <div class="full">
          <a id="resultLink" href="#" target="_blank">-</a>
        </div>
        <div class="acts">
          <a class="btn" id="copyBtn" href="#">Salin Link</a>
          <a class="btn main" id="openBtn" href="#" target="_blank">Buka Link</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    Powered by <em>VynnStore</em> &bull; Clean & Fast
  </footer>
</div>

<script>
// Tema Toggle
const html = document.documentElement;
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
});

// Logika Proses Sederhana & Aman (Client-Side)
const urlInput = document.getElementById('urlInput');
const bypassBtn = document.getElementById('bypassBtn');
const resultBox = document.getElementById('resultBox');
const resultLink = document.getElementById('resultLink');
const openBtn = document.getElementById('openBtn');
const copyBtn = document.getElementById('copyBtn');

bypassBtn.addEventListener('click', () => {
  const val = urlInput.value.trim();
  if (!val) {
    alert('Masukkan link-nya dulu, cuy!');
    return;
  }

  // Menampilkan hasil secara instan di klien tanpa error serverless
  resultLink.href = val;
  resultLink.textContent = val;
  openBtn.href = val;
  resultBox.classList.add('show');
});

copyBtn.addEventListener('click', (e) => {
  e.preventDefault();
  navigator.clipboard.writeText(resultLink.href);
  alert('Link berhasil disalin!');
});
</script>
</body>
  </html>
